<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkly</title>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #f3eef6; color: #1f1a22; font-family: "Avenir Next", "Gill Sans", sans-serif; user-select: none; -webkit-user-select: none; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #161218; color: #f3eaf6; }
      /* Static shell until React mounts — same layout as BootScreen (no legacy copy). */
      .boot-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .boot-stack { display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center; }
      .boot-tag { margin: 0; font-size: 1.08rem; font-weight: 650; letter-spacing: 0.08em; color: #6b6270; }
      html[data-theme="dark"] .boot-tag { color: #a898b0; }
      .boot-brand {
        margin: 0;
        font-family: "Futura", "Avenir Next", "Gill Sans", sans-serif;
        font-weight: 700;
        font-size: 168px;
        line-height: 1.2;
        letter-spacing: -0.09em;
        color: #c07bc4;
      }
      .boot-actions { display: none; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
      .boot-actions.is-visible { display: flex; }
      .boot-actions button {
        font: inherit;
        font-size: 0.88rem;
        font-weight: 650;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #c07bc4;
        background: transparent;
        color: #c07bc4;
        cursor: pointer;
      }
      .boot-actions button:focus-visible { outline: 2px solid #c07bc4; outline-offset: 2px; }
      html[data-theme="dark"] .boot-actions button { border-color: #d89adc; color: #d89adc; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("linkly-theme") || localStorage.getItem("elecom-huge-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-busy="true">
        <div class="boot-stack">
          <h1 class="boot-brand">Linkly</h1>
          <p class="boot-tag">[ Loading ]</p>
          <div class="boot-actions" id="boot-fallback-actions" aria-live="polite">
            <button type="button" id="boot-reload">Reload</button>
          </div>
        </div>
      </main>
    </div>
    <script>
      (function () {
        var actions = document.getElementById("boot-fallback-actions");
        var reload = document.getElementById("boot-reload");
        var show = function () {
          if (actions) actions.classList.add("is-visible");
        };
        window.setTimeout(show, 6000);
        if (reload) reload.addEventListener("click", function () { location.reload(); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
